name: IA analisando métricas - reprovado pela IA

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:

  analisar-metricas:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: IA analisa métricas
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}

        run: |

          echo "Lendo métricas..."

          METRICS=$(jq -c . metrics/system-reprovado.json)

          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQCLOUD_API_KEY" \
            -d "{
              \"model\": \"llama-3.1-8b-instant\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"Você é um classificador binário. Responda APENAS APROVADO ou REPROVADO.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"Analise as métricas: $METRICS\"
                }
              ]
            }")

          echo "$RESPONSE"

          DECISION=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['choices'][0]['message']['content'].strip())")

          echo "Decisão: $DECISION"

          if echo "$DECISION" | grep -qi "^REPROVADO$"; then

            ISSUE_URL=$(gh issue create \
              --title "Métricas reprovadas - ação necessária" \
              --body "A IA reprovou as métricas da aplicação.")

            echo "$ISSUE_URL"

            exit 1

          fi

          echo "✅ Métricas aprovadas! Pipeline prosseguindo..."