name: IA gerando documentação

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  gerar-documentacao:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Capturar último commit
        id: commit_data
        run: |

          echo "COMMIT_MSG<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=%B >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "DIFF<<EOF" >> $GITHUB_ENV
          git show --stat --patch HEAD >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: IA gera documentação
        env:
          GROQ_API_KEY: ${{ secrets.GROKCLOUD_API_KEY }}

        run: |

          PROMPT=$(jq -n \
            --arg msg "$COMMIT_MSG" \
            --arg diff "$DIFF" \
            '{
              model: "llama-3.1-8b-instant",
              messages: [
                {
                  role: "system",
                  content: "Você é um engenheiro de software especialista em documentação técnica."
                },
                {
                  role: "user",
                  content: ("Analise este commit e gere documentação técnica em markdown.\n\nMensagem do commit:\n" + $msg + "\n\nAlterações:\n" + $diff)
                }
              ]
            }')

          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d "$PROMPT")

          echo "$RESPONSE"

          DOC=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          r=json.load(sys.stdin)

          if 'choices' in r:
              print(r['choices'][0]['message']['content'])
          else:
              print(json.dumps(r, indent=2, ensure_ascii=False))")

          echo "$DOC" > DOCUMENTACAO_AUTOMATICA.md

      - name: Commitar documentação
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add DOCUMENTACAO_AUTOMATICA.md

          git commit -m "docs: documentação automática gerada pela IA" || echo "Nada para commitar"

          git push